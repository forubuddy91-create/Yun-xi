
name: Build Yun APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Yun
        run: |
          mkdir -p www assets
          test -f index.html || (echo "index.html not found" && exit 1)
          test -f icon-only.png || (echo "icon-only.png not found" && exit 1)
          cp index.html www/index.html
          cp icon-only.png assets/icon-only.png

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Configure Android
        run: |
          npx cap init Yun com.yun.game --web-dir=www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yun-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
